stages:
  - test
  - package
  - deploy

variables:
  GO_IMAGE: golang:1.27.3-alpine
  NODE_IMAGE: node:20-alpine
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  GIT_DEPTH: "20"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  NPM_CONFIG_REPLACE_REGISTRY_HOST: "always"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------- TEST ----------------

test:backend:
  stage: test
  image: $GO_IMAGE
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go-mod
      - .cache/go-build
  script:
    - cd server
    - go version
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./... -count=1 -coverprofile=coverage.out
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - server/coverage.out

test:frontend-unit:
  stage: test
  image: $NODE_IMAGE
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm
      - client/node_modules
  script:
    - cd client
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run test:unit
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - client/dist

test:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.65.0-jammy
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm
      - node_modules
      - client/node_modules
  script:
    - npm ci --no-audit --no-fund
    - cd client
    - npm ci --no-audit --no-fund
    - cd ..
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - playwright-report
      - test-results

# ---------------- PACKAGE ----------------

.package-rules: &package-rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG

package:backend:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  rules: *package-rules
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f server/Dockerfile -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/backend:latest" server
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

package:backend-osint:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  rules: *package-rules
  timeout: 1h
  when: manual
  allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f server/Dockerfile.osint -t "$CI_REGISTRY_IMAGE/backend-osint:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/backend-osint:latest" server
    - docker push "$CI_REGISTRY_IMAGE/backend-osint:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend-osint:latest"

package:frontend:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  rules: *package-rules
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f client/Dockerfile -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" client
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

# ---------------- DEPLOY ----------------

deploy:production:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && git fetch --all && git checkout '$CI_COMMIT_SHA' && docker compose pull && docker compose up -d --build"
