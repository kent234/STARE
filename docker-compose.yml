version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stare_postgres
    environment:
      POSTGRES_USER: stare
      POSTGRES_PASSWORD: starepass
      POSTGRES_DB: staredb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stare_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: stare_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=stare
      - DB_PASSWORD=starepass
      - DB_NAME=staredb
      - REDIS_HOST=redis
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - STARE_DISABLE_FEEDS=${STARE_DISABLE_FEEDS:-0}
      - STARE_DISABLE_ENRICH=${STARE_DISABLE_ENRICH:-0}
      - STARE_DISABLE_INTEL=${STARE_DISABLE_INTEL:-0}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stare_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: