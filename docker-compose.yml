services:
  postgres:
    image: postgres:15-alpine
    container_name: stare_postgres
    environment:
      POSTGRES_USER: stare
      POSTGRES_PASSWORD: starepass
      POSTGRES_DB: staredb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stare_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile.osint
    container_name: stare_backend
    ports:
      - "8080:8080"
    volumes:
      - ./secrets/ghunt:/root/.malfrats/ghunt
    environment:
      - DB_HOST=postgres
      - DB_USER=stare
      - DB_PASSWORD=starepass
      - DB_NAME=staredb
      - REDIS_HOST=redis
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - NUCLEI_SEVERITY=${NUCLEI_SEVERITY:-}
      - NUCLEI_TIMEOUT=${NUCLEI_TIMEOUT:-}
      - SHERLOCK_BIN=${SHERLOCK_BIN:-/usr/local/bin/sherlock}
      - MAIGRET_BIN=${MAIGRET_BIN:-/usr/local/bin/maigret}
      - MAIGRET_MAX_SITES=${MAIGRET_MAX_SITES:-1000}
      - BLACKBIRD_BIN=${BLACKBIRD_BIN:-/usr/local/bin/blackbird}
      - BLACKBIRD_DIR=${BLACKBIRD_DIR:-/opt/blackbird}
      - HOLEHE_BIN=${HOLEHE_BIN:-/usr/local/bin/holehe}
      - GHUNT_BIN=${GHUNT_BIN:-/usr/local/bin/ghunt}
      - PHONEINFOGA_BIN=${PHONEINFOGA_BIN:-/usr/local/bin/phoneinfoga}
      - EMAILREP_API_KEY=${EMAILREP_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WMN_URL=${WMN_URL:-}
      - WMN_MAX_SITES=${WMN_MAX_SITES:-200}
      - PEOPLE_FIXTURE=${PEOPLE_FIXTURE:-}
      - STARE_DISABLE_FEEDS=${STARE_DISABLE_FEEDS:-0}
      - STARE_DISABLE_ENRICH=${STARE_DISABLE_ENRICH:-0}
      - STARE_DISABLE_INTEL=${STARE_DISABLE_INTEL:-0}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stare_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
