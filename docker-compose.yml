version: '3.8'

services:
  # Бэкенд на Go
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: stare_backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Фронтенд на React
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stare_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped